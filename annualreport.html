<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annual Reports - Special Olympics Singapore</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">

    <!-- Shared Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Shared Header Loaded Dynamically -->
    <header id="site-header"></header>

    <!-- Main Content Area -->
    <main id="main-content">

         <!-- ANNUAL REPORTS SECTION -->
        <section id="reports" class="section">
            <div class="section-header">
                <span class="section-subtitle">Transparency & Governance</span>
                <h2 class="section-title">Annual Reports</h2>
            </div>

            <div class="grid-3">
                <!-- Annual Report Year 1 -->
                <article class="card">
                    <span class="card-tag">FY 2025 / 2026</span>
                    <!-- Thumbnail Image -->
                    <div style="overflow: hidden; border-radius: 6px; margin-bottom: 1rem; border: 1px solid var(--border);">
                    <img src="../images/Annual_Report_2025_2026.jpg" alt="Annual Report 2025/26 Cover" style="width: 100%; height: 380px; object-fit: cover; transition: transform 0.3s ease;">
                    </div>
                    <h3 class="card-title">Annual Report 2025/26</h3>
                    <p class="card-body"></p>
                    <a href="documents/Annual_Report_2025_2026.pdf" class="btn btn-primary" target="_blank" rel="noopener">📄 View Annual Report</a>
                </article>

                <!-- Annual Report Year 2 -->
                <article class="card">
                    <span class="card-tag">FY 2024 / 2025</span>
                    <!-- Thumbnail Image -->
                    <div style="overflow: hidden; border-radius: 6px; margin-bottom: 1rem; border: 1px solid var(--border);">
                    <img src="../images/Annual_Report_2024_2025.jpg" alt="Annual Report 2025/26 Cover" style="width: 100%; height: 380px; object-fit: cover; transition: transform 0.3s ease;">
                    </div>
                    <h3 class="card-title">Annual Report 2024/25</h3>
                    <p class="card-body"></p>
                    <a href="documents/Annual_Report_2024_2025.pdf" class="btn btn-primary" target="_blank" rel="noopener">📄 View Annual Report</a>
                </article>

                <!-- Annual Report Year 3 -->
                <article class="card">
                    <span class="card-tag">FY 2023 / 2024</span>
                    <h3 class="card-title">Annual Report 2023/24</h3>
                    <p class="card-body"></p>
                    <a href="documents/Annual_Report_2023_2024.pdf" class="btn btn-primary" target="_blank" rel="noopener">📄 View Annual Report</a>
                </article>
            </div>
        </section>

    </main>

    <!-- Shared Footer Loaded Dynamically -->
    <footer id="site-footer"></footer>

    <!-- Script to Load Header and Footer Snippets -->
    <script>
        async function loadComponents() {
            try {
                const headerResponse = await fetch('header.html');
                document.getElementById('site-header').innerHTML = await headerResponse.text();

                const footerResponse = await fetch('footer.html');
                document.getElementById('site-footer').innerHTML = await footerResponse.text();

                const mobileToggle = document.getElementById('mobile-toggle');
                const navMenu = document.getElementById('nav-menu');
                if (mobileToggle && navMenu) {
                    mobileToggle.addEventListener('click', () => {
                        const expanded = mobileToggle.getAttribute('aria-expanded') === 'true';
                        mobileToggle.setAttribute('aria-expanded', !expanded);
                        navMenu.classList.toggle('show');
                    });
                }
            } catch (error) {
                console.error("Error loading header/footer components:", error);
            }
        }

        loadComponents();
    </script>
    
    <!-- PDF Popup Modal Structure -->
    <div id="pdf-modal" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); align-items: center; justify-content: center;">
        <div style="background-color: #fff; width: 85%; max-width: 900px; height: 80%; position: relative; border-radius: 8px; display: flex; flex-direction: column; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.3);">
            
            <!-- Modal Header & Close Button -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px;">
                <h3 id="pdf-modal-title" style="margin: 0; font-size: 18px; color: #333;">Annual Report</h3>
                <button id="close-pdf-modal" style="background: none; border: none; font-size: 24px; font-weight: bold; cursor: pointer; color: #666;">&times;</button>
            </div>

            <!-- PDF Frame Viewer -->
            <iframe id="pdf-iframe" src="" style="width: 100%; flex-grow: 1; border: 1px solid #ddd; border-radius: 4px;"></iframe>
        </div>
    </div>

    <!-- Script for PDF Modal Popups -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const modal = document.getElementById('pdf-modal');
            const iframe = document.getElementById('pdf-iframe');
            const modalTitle = document.getElementById('pdf-modal-title');
            const closeBtn = document.getElementById('close-pdf-modal');

            // Open modal when any "View Annual Report" button is clicked
            document.querySelectorAll('.view-pdf-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const pdfSrc = btn.getAttribute('data-pdf');
                    const titleText = btn.getAttribute('data-title');

                    iframe.src = pdfSrc;
                    modalTitle.textContent = titleText;
                    modal.style.display = 'flex';
                });
            });

            // Close modal function
            function closeModal() {
                modal.style.display = 'none';
                iframe.src = ''; // Clears the PDF runner in the background
            }

            closeBtn.addEventListener('click', closeModal);

            // Close modal if user clicks outside the modal box
            window.addEventListener('click', (e) => {
                if (e.target === modal) {
                    closeModal();
                }
            });
        });
    </script>
    
</body>
</html>
