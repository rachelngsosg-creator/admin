<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Stories - Special Olympics Singapore</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">

    <!-- Shared Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Shared Header Loaded Dynamically -->
    <header id="site-header"></header>

    <!-- Main Content Area -->
    <main id="main-content">

        <!-- Full-Width Autoplay Hero Video -->
       <!-- Full-Width Autoplay YouTube Hero Video -->
<!-- Full-Width Autoplay YouTube Hero Video -->
<section class="hero-video-wrapper">
    <iframe 
        class="hero-youtube-video"
        src="https://www.youtube.com/embed/xxg58btI7zI?autoplay=1&mute=1&loop=1&playlist=M7lc1UVf-VE&controls=0&showinfo=0&autohide=1&modestbranding=1&rel=0&enablejsapi=1" 
        title="Background Video"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen>
    </iframe>
</section>

        

        <!-- Body Content Section -->
        <section class="section">
            <div class="section-header">
                <span class="section-subtitle">Impact & Stories</span>
                <h2 class="section-title">Empowering Champions Together</h2>
            </div>
            
            <p style="text-align: center; max-width: 800px; margin: 0 auto; color: var(--text-light);">
                Add your additional page content, articles, or program details here.
            </p>
        </section>

    </main>

    <!-- Shared Footer Loaded Dynamically -->
    <footer id="site-footer"></footer>

    <!-- Script to Load Header and Footer Snippets -->
    <script>
        async function loadComponents() {
            try {
                // Fetch shared Header snippet
                const headerResponse = await fetch('header.html');
                document.getElementById('site-header').innerHTML = await headerResponse.text();

                // Fetch shared Footer snippet
                const footerResponse = await fetch('footer.html');
                document.getElementById('site-footer').innerHTML = await footerResponse.text();

                // Initialize Mobile Nav Toggle after load
                const mobileToggle = document.getElementById('mobile-toggle');
                const navMenu = document.getElementById('nav-menu');
                if (mobileToggle && navMenu) {
                    mobileToggle.addEventListener('click', () => {
                        const expanded = mobileToggle.getAttribute('aria-expanded') === 'true';
                        mobileToggle.setAttribute('aria-expanded', !expanded);
                        navMenu.classList.toggle('show');
                    });
                }
            } catch (error) {
                console.error("Error loading header/footer components:", error);
            }
        }

        loadComponents();
    </script>
</body>
</html>
