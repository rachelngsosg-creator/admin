<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Special Olympics Singapore</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">

    <!-- Shared Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Shared Header Loaded Dynamically -->
    <header id="site-header"></header>

    <!-- Main Content Area -->
    <main id="main-content">

        <!-- CONTACT US SECTION -->
        <section class="page-hero">
            <img src="images/Image11.jpg" alt="Special Olympics Singapore" class="page-hero-img">
            <div class="page-hero-overlay">
                <div class="page-hero-content">
                    <span class="section-subtitle">Get In Touch</span>
                    <h1 class="page-hero-title">Contact Information</h1>
                </div>
            </div>
        </section>

        <section class="section">
            <!-- Three Column Contact Card Wrapper -->
            <div class="contact-info-card-wrapper">
                
                <!-- Contact Us (Phone) Column -->
                <div class="contact-column">
                    <div class="contact-icon-box">
                        <span class="contact-icon-symbol">📞</span>
                    </div>
                    <div class="contact-col-content">
                        <h3 class="contact-col-heading">Contact Us</h3>
                        <a href="tel:652933182" class="contact-col-text">6293 3182</a>
                    </div>
                </div>

                <!-- E-Mail Us Column -->
                <div class="contact-column">
                    <div class="contact-icon-box">
                        <span class="contact-icon-symbol">✉️</span>
                    </div>
                    <div class="contact-col-content">
                        <h3 class="contact-col-heading">E-Mail Us</h3>
                        <a href="mailto:admin@specialolympics.org.sg" class="contact-col-text">admin@specialolympics.org.sg</a>
                    </div>
                </div>

                <!-- Location Column -->
                <div class="contact-column">
                    <div class="contact-icon-box">
                        <span class="contact-icon-symbol">📍</span>
                    </div>
                    <div class="contact-col-content">
                        <h3 class="contact-col-heading">Location</h3>
                        <p class="contact-col-text">
                            Block 2 Saint George's Road,<br>
                            #01-65, Singapore 322002
                        </p>
                    </div>
                </div>

            </div>

            <!-- Optional: Google Map embed section underneath the card -->
            <div style="margin-top: 3rem; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); box-shadow: var(--shadow);">
                <iframe 
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3988.761899538356!2d103.85698047591325!3d1.3182607616782806!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x31da19c40ea05c7d%3A0xe67db07d896bb21e!2s2%20St%20George&#39;s%20Rd%2C%20Singapore%20322002!5e0!2m2!1sen!2ssg!4v1700000000000!5m2!1sen!2ssg" 
                    width="100%" 
                    height="350" 
                    style="border:0;" 
                    allowfullscreen="" 
                    loading="lazy" 
                    referrerpolicy="no-referrer-when-downgrade"
                    title="Location Map - Special Olympics Singapore HQ">
                </iframe>
            </div>
        </section>

    </main>

    <!-- Shared Footer Loaded Dynamically -->
    <footer id="site-footer"></footer>

    <!-- Script to Load Header and Footer Snippets -->
    <script>
        async function loadComponents() {
            try {
                // Fetch shared Header snippet
                const headerResponse = await fetch('header.html');
                document.getElementById('site-header').innerHTML = await headerResponse.text();

                // Fetch shared Footer snippet
                const footerResponse = await fetch('footer.html');
                document.getElementById('site-footer').innerHTML = await footerResponse.text();

                // Initialize Mobile Nav Toggle after load
                const mobileToggle = document.getElementById('mobile-toggle');
                const navMenu = document.getElementById('nav-menu');
                if (mobileToggle && navMenu) {
                    mobileToggle.addEventListener('click', () => {
                        const expanded = mobileToggle.getAttribute('aria-expanded') === 'true';
                        mobileToggle.setAttribute('aria-expanded', !expanded);
                        navMenu.classList.toggle('show');
                    });
                }
            } catch (error) {
                console.error("Error loading header/footer components:", error);
            }
        }

        loadComponents();
    </script>
</body>
</html>
